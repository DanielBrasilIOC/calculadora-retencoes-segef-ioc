name: Install local PDF and OCR libraries

on:
  push:
    paths:
      - ".github/workflows/install-local-pdf-ocr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-libraries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download pinned open-source packages
        run: |
          npm init -y
          npm install --no-save --ignore-scripts pdfjs-dist@6.5.438 tesseract.js@7.0.0 tesseract.js-core@7.0.0 @tesseract.js-data/por@1.0.0

      - name: Copy runtime files into the repository
        run: |
          mkdir -p vendor/pdfjs vendor/tesseract vendor/tesseract-core vendor/tessdata
          cp node_modules/pdfjs-dist/build/pdf.mjs vendor/pdfjs/
          cp node_modules/pdfjs-dist/build/pdf.worker.mjs vendor/pdfjs/
          cp node_modules/tesseract.js/dist/worker.min.js vendor/tesseract/
          cp node_modules/tesseract.js/dist/tesseract.min.js vendor/tesseract/
          find node_modules/tesseract.js-core -type f -name 'tesseract-core*.wasm.js' -exec cp {} vendor/tesseract-core/ \;
          find node_modules/tesseract.js-core -type f -name 'tesseract-core*.wasm' -exec cp {} vendor/tesseract-core/ \;
          find node_modules/@tesseract.js-data/por -type f -name 'por.traineddata*' -exec cp {} vendor/tessdata/ \\;
          test -s vendor/pdfjs/pdf.mjs
          test -s vendor/pdfjs/pdf.worker.mjs
          test -s vendor/tesseract/worker.min.js
          test -s vendor/tesseract/tesseract.min.js
          test -n "$(find vendor/tesseract-core -type f -name 'tesseract-core*.wasm.js' -print -quit)"
          test -n "$(find vendor/tessdata -type f -name 'por.traineddata*' -print -quit)"
          cp node_modules/pdfjs-dist/LICENSE vendor/pdfjs/LICENSE
          cp node_modules/tesseract.js/LICENSE vendor/tesseract/LICENSE
          cp node_modules/tesseract.js-core/LICENSE vendor/tesseract-core/LICENSE
          cp node_modules/@tesseract.js-data/por/LICENSE vendor/tessdata/LICENSE

      - name: Commit vendored libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --cached --quiet; then
            echo "No vendor changes to commit."
          else
            git commit -m "Add local PDF.js and Portuguese OCR libraries"
            git push
          fi
